
<!DOCTYPE html>
<html>
<head>
    <title>My Personal Library</title>
</head>
<body>

    <h1>My Personal Library</h1>
    <p>Welcome to my book collection!</p>

    <hr>

    <h2>My Favourite Books</h2>

    <table border="1">
        <tr>
            <th>Book Name</th>
            <th>Author</th>
            <th>Genre</th>
        </tr>
        <tr>
            <td>Wings of Fire</td>
            <td>A.P.J. Abdul Kalam</td>
            <td>Autobiography</td>
        </tr>
        <tr>
            <td>The Alchemist</td>
            <td>Paulo Coelho</td>
            <td>Fiction</td>
        </tr>
        <tr>
            <td>Atomic Habits</td>
            <td>James Clear</td>
            <td>Self-help</td>
        </tr>
    </table>

    <h2>Add a New Book</h2>

    <form>
        <label>Book Name:</label>
        <input type="text" name="bookname">
        <br><br>

        <label>Author Name:</label>
        <input type="text" name="author">
        <br><br>

        <label>Genre:</label>
        <select name="genre">
            <option>Fiction</option>
            <option>Science</option>
            <option>Biography</option>
            <option>Self-help</option>
        </select>
        <br><br>

        <input type="submit" value="Add Book">
    </form>

    <hr>

    <footer>
        <p>My Personal Library - 2026</p>
    </footer>

</body>
</html>
