<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero Section</title>
</head>
<style>
 
    .left{
        flex-grow:1;
    }
    .right{
        flex-grow: 2;
        display: flex;
        justify-content: center;
    }
       .container{
        display: flex;
        padding: 50px;
      align-items: center;
    }
    .image{
        width: 200px;
        height: 200px;
    }
    .btn1{
        border: none;
        padding: 10px 20px;
        background-color: green;
        border-radius: 20px;
        transition: all 0.2s ease 0;
        cursor: pointer;
    }
    .btn2{
        border: none;
        padding: 10px 20px;
        border-radius: 20px;
    }
    .btn1:hover{
        transform: scale(1.1);

    }
    
    @media (max-width : 600px) {
        .container{
            flex-direction: column;   
        }
        .left{
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 50px;
        }
        p{
            text-align: center;
        }
    }
</style>
<body>
    <div class="container">
        <div class="left">
            <h1>Code your Future With Me</h1>
            <p>Lorem ipsum, dolor sit amet consectetur adipisicing elit.<br> Laborum soluta cupiditate quod, veritatis, saepe accusamus<br> eos temporibus repudiandae.
            </p>
            <button class ="btn1">Login</button>
            <button class ="btn2">sign Up</button>
            </div>
            <div class="right">
                <img src="./Assets/CodingImage.png" class="image" alt="coding image">
            </div>
    </div>
    
</body>
</html>
