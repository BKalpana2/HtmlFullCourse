<!DOCTYPE html>

<html>
<head>
    <title>Online Food Order Form</title>
</head>
<body>


<h1>Online Food Order Form</h1>

<form>

    <label for="name">Customer Name:</label>
    <input type="text" id="name" name="name" required>
    <br><br>

    <label for="email">Email:</label>
    <input type="email" id="email" name="email" required>
    <br><br>

    <label for="phone">Phone Number:</label>
    <input type="tel" id="phone" name="phone">
    <br><br>

    <label for="food">Select Food:</label>
    <select id="food" name="food">
        <option value="">-- Select Food --</option>
        <option value="pizza">Pizza</option>
        <option value="burger">Burger</option>
        <option value="biryani">Biryani</option>
        <option value="dosa">Dosa</option>
    </select>
    <br><br>

    <label>Food Size:</label>
    <input type="radio" id="small" name="size" value="small">
    <label for="small">Small</label>

    <input type="radio" id="medium" name="size" value="medium">
    <label for="medium">Medium</label>

    <input type="radio" id="large" name="size" value="large">
    <label for="large">Large</label>
    <br><br>

    <label for="quantity">Quantity:</label>
    <input type="number" id="quantity" name="quantity" min="1" max="10">
    <br><br>

    <label>Extra Items:</label>
    <input type="checkbox" id="cheese" name="extra" value="cheese">
    <label for="cheese">Extra Cheese</label>

    <input type="checkbox" id="drinks" name="extra" value="drinks">
    <label for="drinks">Cold Drink</label>
    <br><br>

    <label for="address">Delivery Address:</label>
    <br>
    <textarea id="address" name="address" rows="4" cols="30"></textarea>
    <br><br>

    <label for="date">Delivery Date:</label>
    <input type="date" id="date" name="date">
    <br><br>

    <label for="payment">Payment Method:</label>
    <select id="payment" name="payment">
        <option value="upi">UPI</option>
        <option value="cash">Cash on Delivery</option>
        <option value="card">Card</option>
    </select>
    <br><br>

    <button type="submit">Place Order</button>
    <button type="reset">Reset</button>

</form>


</body>
</html>
