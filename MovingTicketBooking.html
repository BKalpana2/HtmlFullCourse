<!DOCTYPE html>
<html>
<head>
    <title>Movie Ticket Booking</title>
</head>

<body>

    <h1>🎬 Movie Ticket Booking</h1>
    <hr>

    <form>

        <label>Full Name:</label><br>
        <input type="text" name="name" placeholder="Enter your name">
        <br><br>

        <label>Email:</label><br>
        <input type="email" name="email" placeholder="Enter your email">
        <br><br>

        <label>Select Movie:</label><br>
        <select name="movie">
            <option>Choose a movie</option>
            <option>Interstellar</option>
            <option>Inception</option>
            <option>Avengers</option>
            <option>RRR</option>
            <option>Pushpa</option>
        </select>
        <br><br>

        <label>Select Date:</label><br>
        <input type="date" name="date">
        <br><br>

        <label>Select Show Time:</label><br>
        <input type="radio" name="time"> 10:00 AM
        <input type="radio" name="time"> 2:00 PM
        <input type="radio" name="time"> 6:00 PM
        <input type="radio" name="time"> 9:00 PM
        <br><br>

        <label>Number of Tickets:</label><br>
        <input type="number" name="tickets" min="1" max="10">
        <br><br>

        <label>Seat Preference:</label><br>
        <input type="checkbox" name="seat"> Front Row
        <input type="checkbox" name="seat"> Middle Row
        <input type="checkbox" name="seat"> Back Row
        <br><br>

        <label>Special Request:</label><br>
        <textarea rows="4" cols="40" placeholder="Enter your request"></textarea>
        <br><br>

        <input type="submit" value="Book Ticket">
        <input type="reset" value="Clear">

    </form>

    <hr>

    <p>Thank you for choosing our movie booking service! 🍿</p>

</body>
</html>
